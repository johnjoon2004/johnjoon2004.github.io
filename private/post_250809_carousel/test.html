<script type="module">
import React, { useState, useCallback, useMemo, useRef, useImperativeHandle } from 'https://esm.sh/react@18';
import { createRoot } from 'https://esm.sh/react-dom@18/client';

// 3D 캐러셀 컴포넌트
const getCarouselBaseStyle = (cellDirection, cellCount, cellWidth, cellHeight, cellGap) => {
  const pi = 3.14159265358979;
  const r = cellDirection === "horizontal"
    ? `calc(calc(calc(${cellWidth} + ${cellGap}) / 2) / tan(${pi} / ${cellCount}))`
    : `calc(calc(calc(${cellHeight} + ${cellGap}) / 2) / tan(${pi} / ${cellCount}))`;
  
  return {
    '--cell-count': cellCount,
    '--cell-width': cellWidth,
    '--cell-height': cellHeight,
    '--cell-gap': cellGap,
    '--pi': pi,
    '--r': r,
    margin: '0 auto',
    width: 'fit-content'
  };
};

const sceneStyle = {
  width: 'calc(var(--cell-width) + var(--cell-gap))',
  height: 'calc(var(--cell-height) + var(--cell-gap))',
  position: 'relative',
  perspective: '1000px'
};

const sceneInternalStyle = {
  position: 'absolute',
  height: '100%',
  width: '100%',
  transition: 'transform 1s',
  transformStyle: 'preserve-3d',
  transform: 'translateZ(calc(-1 * var(--r)))'
};

const getCellStyle = (cellDirection, rotationAngle, cellNumber, cellCount) => ({
  position: 'absolute',
  top: 'calc(var(--cell-gap) / 2)',
  left: 'calc(var(--cell-gap) / 2)',
  right: 'calc(var(--cell-gap) / 2)',
  bottom: 'calc(var(--cell-gap) / 2)',
  willChange: 'transform',
  transition: 'transform 1s',
  transform: cellDirection === "horizontal"
    ? `rotateY(${rotationAngle}deg) translateZ(var(--r))`
    : `rotateX(${rotationAngle}deg) translateZ(var(--r))`,
  backgroundColor: `hsla(${360 / cellCount * cellNumber}, 100%, 50%, 0.8)`
});

const cellSlideStyle = {
  width: '100%',
  height: '100%'
};

const Carousel3D = React.forwardRef(({
  items,
  direction = "horizontal",
  cellWidth = "190px",
  cellHeight = "120px",
  cellGap = "10px",
  className = "",
  ...otherProps
}, ref) => {
  const refBase = useRef(null);
  const [currentLap, setCurrentLap] = useState(0);
  const [currentCellIndex, setCurrentCellIndex] = useState(0);

  const rotationAngles = useMemo(() => {
    const step = 360 / items.length;
    return items.map((_, index) => {
      return direction === "horizontal"
        ? index * step + (-currentLap * 360) + (-currentCellIndex * step)
        : -index * step + (currentLap * 360) + (currentCellIndex * step);
    });
  }, [items, direction, currentLap, currentCellIndex]);

  const cellNext = useCallback(() => {
    setCurrentCellIndex((prev) => {
      const next = prev >= items.length - 1 ? 0 : prev + 1;
      if (prev >= items.length - 1) {
        setCurrentLap((prevLap) => prevLap + 1);
      }
      return next;
    });
  }, [items.length]);

  const cellPrev = useCallback(() => {
    setCurrentCellIndex((prev) => {
      const next = prev <= 0 ? items.length - 1 : prev - 1;
      if (prev <= 0) {
        setCurrentLap((prevLap) => prevLap - 1);
      }
      return next;
    });
  }, [items.length]);

  useImperativeHandle(ref, () => ({
    refBase,
    cellNext,
    cellPrev,
  }));

  const carousel3DCells = useMemo(() => {
    return items.map((item, index) => {
      const rotationAngle = rotationAngles[index];
      return React.createElement('div', {
        key: index,
        style: getCellStyle(direction, rotationAngle, index + 1, items.length)
      }, React.createElement('div', { style: cellSlideStyle }, item));
    });
  }, [items, direction, rotationAngles]);

  return React.createElement('div', {
    ref: refBase,
    style: getCarouselBaseStyle(direction, items.length, cellWidth, cellHeight, cellGap),
    className: className,
    ...otherProps
  }, React.createElement('div', { style: sceneStyle }, 
    React.createElement('div', { style: sceneInternalStyle }, carousel3DCells)
  ));
});

// 블로그 포스트 데이터
const blogPosts = [

    link: "/posts/react-3d-carousel"

  React.createElement(BlogPostCard, {
    key: "2",

  React.createElement(BlogPostCard, {

];

function BlogCarousel() {

  return React.createElement('div', { style: { padding: '20px 0' } },
    React.createElement('div', { style: { textAlign: 'center', marginBottom: '30px' } },

}

</script>
